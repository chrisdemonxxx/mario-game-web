name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  qa-gate:
    name: qa-gate
    if: github.event_name == 'pull_request'
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate SHA binding
        run: |
          PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$PR_HEAD_SHA" != "$CURRENT_SHA" ]; then
            echo "ERROR: PR head SHA $PR_HEAD_SHA does not match checkout SHA $CURRENT_SHA"
            exit 1
          fi
          # TODO: Implement QA and review attestation validation:
          # 1. Find recent QA/Reviewer comments on this PR
          # 2. Verify the SHA in that comment matches current HEAD
          # 3. Check for REVIEW: APPROVED label/comment
          # 4. Block merge if any attestation is missing, stale, or contradictory
          echo "ERROR: QA/Review attestation validation not yet implemented - blocking merge for safety"
          exit 1